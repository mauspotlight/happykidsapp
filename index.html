<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b940b1">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Happy Kids Reservas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<style>
/* Layout: app bar con logo · calendario anual (12 meses) a la izquierda · panel del día a la derecha; en móvil se apilan */
:root{
  --lime:#9fbb1c; --magenta:#b940b1; --cyan:#0093cb;
  --bg:#f6f7f2; --surface:#ffffff; --surface-2:#eef1e6; --line:#dfe3d4;
  --fg:#2b2d33; --muted:#6b6f78; --on-accent:#ffffff;
  --heat-1:#f3dcf1; --heat-2:#e3a6de; --heat-3:#b940b1; --heat-fg-3:#ffffff;
  --pick:#d6f0fa; --pick-line:#0093cb;
  --danger:#c2410c; --ok:#4d7c0f;
  --f-display:"Baloo 2", "Arial Rounded MT Bold", system-ui, sans-serif;
  --f-body:"Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --lime:#c3dc4a; --magenta:#d978d1; --cyan:#45c1ee;
  --bg:#17181c; --surface:#202227; --surface-2:#2a2d33; --line:#363a42;
  --fg:#eceef1; --muted:#a2a7b1; --on-accent:#17181c;
  --heat-1:#40263f; --heat-2:#7a3a74; --heat-3:#d978d1; --heat-fg-3:#17181c;
  --pick:#163847; --pick-line:#45c1ee; --danger:#fb923c; --ok:#a3e635; color-scheme:dark}}
:root[data-theme="dark"]{
  --lime:#c3dc4a; --magenta:#d978d1; --cyan:#45c1ee;
  --bg:#17181c; --surface:#202227; --surface-2:#2a2d33; --line:#363a42;
  --fg:#eceef1; --muted:#a2a7b1; --on-accent:#17181c;
  --heat-1:#40263f; --heat-2:#7a3a74; --heat-3:#d978d1; --heat-fg-3:#17181c;
  --pick:#163847; --pick-line:#45c1ee; --danger:#fb923c; --ok:#a3e635; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
h1,h2,h3{font-family:var(--f-display);line-height:1.1;margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.logo{display:block;height:40px;width:auto}
.logo-dark{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo-light{display:none}:root:not([data-theme="light"]) .logo-dark{display:block}}
:root[data-theme="dark"] .logo-light{display:none}:root[data-theme="dark"] .logo-dark{display:block}

/* App bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar-in{display:flex;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap}
.bar .tag{font-family:var(--f-display);font-weight:600;color:var(--muted);font-size:15px;padding-left:14px;border-left:2px solid var(--line)}
.tabs{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.tab{border:0;background:transparent;padding:7px 12px;border-radius:999px;cursor:pointer;font-weight:700;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--fg);color:var(--bg)}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--lime);color:#23270b;font-weight:800;font-family:var(--f-display)}
.link{border:0;background:none;color:var(--cyan);cursor:pointer;font-weight:700;padding:4px}

/* Buttons & fields */
.btn{border:0;border-radius:999px;padding:10px 18px;font-weight:800;cursor:pointer;background:var(--magenta);color:var(--on-accent);font-family:var(--f-display);font-size:16px;letter-spacing:.01em}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--fg);border:1.5px solid var(--line)}
.btn.small{padding:6px 12px;font-size:14px}
.btn.danger{background:var(--danger)}
label.f{display:grid;gap:4px;font-size:13px;font-weight:700;color:var(--muted)}
.in{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;font-weight:600;color:var(--fg)}
.in:focus{border-color:var(--cyan);outline:none}
/* Desplegables con la línea gráfica */
.dd{position:relative;width:100%;min-width:0}
.dd-native{position:absolute!important;inset:0;opacity:0;pointer-events:none;width:100%!important}
.dd-btn{width:100%;display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:7px 8px 7px 12px;font-weight:700;color:var(--fg);cursor:pointer;text-align:left;min-height:42px}
.dd-btn:hover{border-color:var(--magenta)}
.dd.open .dd-btn{border-color:var(--cyan);box-shadow:0 0 0 3px color-mix(in srgb,var(--cyan) 22%,transparent)}
.dd-btn:disabled{cursor:not-allowed;opacity:.55;border-style:dashed}
.dd-btn:disabled:hover{border-color:var(--line)}
.dd-val{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:8px}
.dd-val.ph-text{color:var(--muted);font-weight:600}
.dd-chev{flex:none;width:26px;height:26px;border-radius:50%;background:var(--magenta);color:var(--on-accent);display:grid;place-items:center;transition:transform .15s}
.dd.open .dd-chev{transform:rotate(180deg);background:var(--cyan)}
.dd-emoji{font-size:18px;line-height:1;flex:none}
.dd-img{width:28px;height:28px;border-radius:7px;object-fit:contain;background:var(--surface-2);flex:none}
.dd-list{position:absolute;left:0;top:calc(100% + 6px);z-index:30;min-width:100%;width:max-content;max-width:min(360px,calc(100vw - 32px));max-height:320px;overflow:auto;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 14px 34px -12px rgba(30,20,40,.35);display:grid;gap:2px;overscroll-behavior:contain}
.dd.up .dd-list{top:auto;bottom:calc(100% + 6px)}
.dd.right .dd-list{left:auto;right:0}
.dd-grp{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:10px 8px 4px}
.dd-grp:first-child{padding-top:4px}
.dd-opt{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;border-radius:9px;padding:8px 10px;font-weight:700;text-align:left;cursor:pointer;color:var(--fg)}
.dd-opt:hover,.dd-opt:focus-visible{background:var(--surface-2);outline:none}
.dd-opt[aria-selected="true"]{background:color-mix(in srgb,var(--magenta) 14%,transparent);color:var(--magenta)}
.dd-opt[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.dd-opt .dd-t{flex:1;min-width:0}
.dd-count{font-size:12px;font-weight:800;color:var(--muted);background:var(--surface-2);border-radius:999px;padding:1px 8px;font-variant-numeric:tabular-nums}
.dd-check{color:var(--magenta);font-weight:900}
.err{color:var(--danger);font-weight:700;font-size:13px;min-height:1em}
.okmsg{color:var(--ok);font-weight:700;font-size:13px}

/* Login */
.center{min-height:80vh;display:grid;place-items:center;padding-block:24px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:28px;width:100%;max-width:400px;display:grid;gap:16px}
.card .logo{height:56px;margin:0 auto 4px}
.card h1{font-size:26px;text-align:center}
.card p{margin:0;color:var(--muted);text-align:center;font-size:14px}
.stripe{height:6px;border-radius:6px;background:linear-gradient(90deg,var(--lime) 0 33%,var(--magenta) 33% 66%,var(--cyan) 66%)}

/* Main grid */
.main{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px;margin-top:20px;align-items:start}
@media (max-width:980px){.main{grid-template-columns:minmax(0,1fr)}}
.yearhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.yearhead h2{font-size:40px;font-weight:800;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.yearhead .arrows{display:flex;gap:6px}
.icon-btn{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-weight:800;font-size:18px;line-height:1}
.filters{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap;align-items:center}
.filters select{max-width:260px}
.legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted);margin-bottom:12px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:5px}
.summary{font-size:13px;color:var(--muted);font-weight:600}
.summary b{color:var(--fg);font-variant-numeric:tabular-nums}

.months{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.month{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 10px}
.month h3{font-size:18px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.month h3 small{font-family:var(--f-body);font-size:12px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;font-variant-numeric:tabular-nums}
.dow{font-size:10px;font-weight:800;color:var(--muted);text-align:center;letter-spacing:.06em;padding-bottom:2px}
.yearhead h2 .yr{color:var(--muted);font-weight:600}
.jumpbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.jumpbar .dd{width:auto}
.jumpbar .dd-jm-month{min-width:150px}.jumpbar .dd-jm-year{min-width:104px}
.jumpbar .summary{margin-left:auto}
.yearhead{margin-bottom:10px}
.yearhead h2{min-width:0}
@media (max-width:640px){.yearhead{gap:8px;flex-wrap:nowrap}.yearhead h2{font-size:24px;flex:1;text-align:center;white-space:nowrap}.yearhead .icon-btn{flex:none}
.jumpbar .dd-jm-month{flex:2;min-width:0}.jumpbar .dd-jm-year{flex:1;min-width:0}.jumpbar .summary{margin-left:0;width:100%}}
.mcal{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.mdow{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;padding:10px 8px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.mday{min-height:108px;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:transparent;text-align:left;padding:6px;display:flex;flex-direction:column;gap:4px;cursor:pointer;position:relative;min-width:0;color:var(--fg)}
.mday:nth-child(7n){border-right:0}
.mday.blank{background:var(--surface-2);opacity:.5;cursor:default}
.mday:not(.blank):hover{background:var(--surface-2)}
.mday .num{font-family:var(--f-display);font-weight:700;font-size:17px;line-height:1;width:28px;height:28px;display:grid;place-items:center;border-radius:50%;font-variant-numeric:tabular-nums}
.mday.today .num{background:var(--lime);color:#23270b}
.mday.past .num{color:var(--muted)}
.mday.sel{box-shadow:inset 0 0 0 3px var(--fg)}
.mday.pick{background:var(--pick)}
.mday .cnt{position:absolute;top:8px;right:8px;font-size:11px;font-weight:800;background:var(--magenta);color:var(--on-accent);border-radius:999px;min-width:20px;height:20px;padding:0 6px;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.evs{display:grid;gap:3px;min-width:0}
.ev{font-size:11.5px;font-weight:700;line-height:1.25;padding:2px 6px;border-radius:5px;background:color-mix(in srgb,var(--c) 16%,transparent);border-left:3px solid var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.more{font-size:11px;font-weight:700;color:var(--muted);padding-left:4px}
@media (max-width:640px){.mday{min-height:64px;padding:4px;align-items:center}.evs{display:none}.mday .cnt{position:static}.mday .num{font-size:15px}.mdow{text-align:center;padding:8px 2px;font-size:10px;letter-spacing:.04em}}
.day{aspect-ratio:1;max-width:100%;border:0;background:transparent;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer;position:relative;color:var(--fg);padding:0}
.day:hover{background:var(--surface-2)}
.day.h1{background:var(--heat-1)}.day.h2{background:var(--heat-2)}.day.h3{background:var(--heat-3);color:var(--heat-fg-3)}
.day.pick{background:var(--pick);box-shadow:inset 0 0 0 2px var(--pick-line);color:var(--fg)}
.day.today::after{content:"";position:absolute;left:50%;bottom:3px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--lime)}
.day.sel{outline:2.5px solid var(--fg);outline-offset:-1px}
.day.past{opacity:.55}
.day.blank{visibility:hidden}

/* Day panel */
.panel{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);background:var(--surface);border:1px solid var(--line);border-radius:18px}
.panel-head{border-radius:17px 17px 0 0}
@media (max-width:980px){.panel{position:static}}
.panel-head{padding:18px 20px 14px;background:var(--surface-2)}
.panel-head .eyebrow{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--magenta)}
.panel-head h2{font-size:28px;font-weight:700;margin-top:2px}
.panel-body{padding:16px 20px 20px;display:grid;gap:18px}
.res-list{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.res{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;align-items:start;border-left:5px solid var(--c,var(--magenta))}
.res-body{display:grid;gap:2px;min-width:0}
.ph{display:block;object-fit:contain;background:var(--surface-2);border-radius:10px;flex:none;max-width:100%}
.ph-empty{display:block}
.game-ph{display:grid;place-items:center;background:var(--surface-2);border-radius:10px;padding:8px;margin-bottom:4px}
.game-ph .ph{background:transparent;width:112px;height:112px}
.nr-prev{display:flex;gap:12px;align-items:center;border:1.5px solid var(--line);border-radius:12px;padding:8px 10px}
.nr-prev .g{font-family:var(--f-display);font-weight:700;font-size:16px;line-height:1.15}
.nr-prev .meta{font-size:13px;color:var(--muted)}
.ev{display:flex;align-items:center;gap:4px}
.ev .ev-ph{width:18px;height:18px;border-radius:4px;background:transparent}
.ev-t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.res .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.res .g{font-family:var(--f-display);font-weight:700;font-size:17px;line-height:1.15}
.res .meta{font-size:13px;color:var(--muted)}
.res .cl{font-weight:700}
.res .acts{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
.empty{color:var(--muted);font-size:14px;border:1.5px dashed var(--line);border-radius:12px;padding:14px;text-align:center}
.form{display:grid;gap:10px}
.form h3{font-size:19px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chip{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);letter-spacing:.02em}

/* Catalog & team */
.section{margin-top:22px}
.section-head{display:flex;gap:12px;align-items:end;flex-wrap:wrap;margin-bottom:14px}
.section-head h2{font-size:34px;font-weight:800}
.section-head p{margin:0;color:var(--muted)}
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.game{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:6px;border-top:5px solid var(--c)}
.game h3{font-size:18px;font-weight:700}
.game .meta{font-size:13px;color:var(--muted)}
.game .next{font-size:12px;font-weight:700}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.pill{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-weight:700;cursor:pointer;font-size:13px}
.pill[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.team{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:24px;align-items:start}
@media (max-width:860px){.team{grid-template-columns:minmax(0,1fr)}}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
tr:last-child td{border-bottom:0}
.testbar{margin-top:12px;background:color-mix(in srgb,var(--lime) 22%,var(--surface));border:1px solid color-mix(in srgb,var(--lime) 60%,var(--line));border-radius:12px;padding:8px 14px;font-size:13px;font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;z-index:20;max-width:calc(100% - 32px)}
.notice{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;color:var(--muted);font-size:14px}
@media (prefers-reduced-motion:no-preference){.day,.btn,.pill{transition:background .15s, transform .15s}.btn:active{transform:scale(.97)}}
</style>

</head>
<body>
<div id="app"></div>

function ph(g,sz,cls=''){const u=g&&FOTOS[g.id];return u?`<img class="ph ${cls}" src="${u}" width="${sz}" height="${sz}" alt="" loading="lazy">`:`<span class="ph ph-empty ${cls}" style="width:${sz}px;height:${sz}px"></span>`}
const CATS = {
  I:{n:'Juegos inflables',c:'#b940b1',e:'🏰'}, A:{n:'Juegos acuáticos',c:'#0093cb',e:'💦'}, F:{n:'Juegos de feria',c:'#e07b00',e:'🎯'},
  M:{n:'Juegos mecánicos',c:'#5b6bd6',e:'🎠'}, B:{n:'Juegos para bebés',c:'#d65b8f',e:'🍼'}, J:{n:'Juegos',c:'#7f9b10',e:'🤸'},
  S:{n:'Snacks',c:'#c0841a',e:'🍿'}, C:{n:'Caritas pintadas',c:'#14a38b',e:'🎨'}, T:{n:'Taller de pizza',c:'#c2410c',e:'🍕'}
};
const GAMES = CAT.map(([id,name,tags,age,dims])=>{
  const primary = tags.includes('A') && !tags.includes('I') ? 'A' : (tags.replace('J','')[0] || tags[0]);
  return {id,name,tags,primary,age,dims};
});
const GBY = Object.fromEntries(GAMES.map(g=>[g.id,g]));
const GUEST = {id:'__invitado', nombre:'Invitado', rol:'invitado'};
const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

const S = { db:null, ready:false, staff:null, res:[], me:null, view:'cal', year:new Date().getFullYear(), month:new Date().getMonth(),
  sel:isoDate(new Date()), gameFilter:'', catFilter:'', confirmDel:null, err:'', dbMissing:false };

function isoDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function parseIso(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function store(k,v){try{v===null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}
function load(k){try{return localStorage.getItem(k)}catch(e){return null}}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2600)}
function catColor(g){return CATS[g?.primary]?.c||'#888'}
function initials(n){return (n||'?').split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase()}

async function hash(pw,salt){
  const data=new TextEncoder().encode(salt+':'+pw);
  const buf=await crypto.subtle.digest('SHA-256',data);
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
function newSalt(){const a=new Uint8Array(12);crypto.getRandomValues(a);return [...a].map(b=>b.toString(16).padStart(2,'0')).join('')}
function slugUser(s){return s.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9._-]/g,'')}

/* ---------- data ---------- */
/* Modo prueba: guarda los datos en este navegador (localStorage), con la misma forma que la base compartida */
function localDb(){
  const KEY='hk_db_v1', subs={};
  const read=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return {}}};
  let data=read();
  const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}};
  const snap=name=>({docs:Object.entries(data[name]||{}).map(([id,d])=>({id,exists:true,data:()=>({...d})}))});
  const emit=name=>(subs[name]||[]).forEach(fn=>fn(snap(name)));
  window.addEventListener('storage',e=>{if(e.key===KEY){data=read();Object.keys(subs).forEach(emit)}});
  return {collection(name){return {
    onSnapshot(fn){(subs[name] ||= []).push(fn);setTimeout(()=>fn(snap(name)),0);return()=>{subs[name]=subs[name].filter(f=>f!==fn)}},
    doc(id){return {
      async get(){const d=data[name]?.[id];return {id,exists:!!d,data:()=>d&&{...d}}},
      async set(d){(data[name] ||= {})[id]={...d};save();emit(name)},
      async update(d){if(!data[name]?.[id]) throw {code:'not_found'};Object.assign(data[name][id],d);save();emit(name)},
      async delete(){if(data[name]) delete data[name][id];save();emit(name)}
    }}
  }}};
}
async function boot(){
  render();
  let db=null;
  const framed=window.parent!==window;
  for(let i=0;i<(framed?30:3) && !window.claude?.use;i++) await new Promise(r=>setTimeout(r,100));
  try{ db = window.claude?.use ? await window.claude.use('db') : null }catch(e){ db=null }
  if(!db){ db=localDb(); S.localMode=true; }
  S.db=db;
  db.collection('staff').onSnapshot(snap=>{
    S.staff=snap.docs.map(d=>({id:d.id,...d.data()}));
    const saved=load('hk_user');
    if(saved===GUEST.id && !S.me) S.me=GUEST;
    if(saved && !S.me){ const u=S.staff.find(x=>x.id===saved && x.activo!==false); if(u) S.me=u; }
    if(S.me && S.me!==GUEST){ const u=S.staff.find(x=>x.id===S.me.id); S.me = (u && u.activo!==false) ? u : null; if(!S.me) store('hk_user',null); }
    S.ready=true; render();
  }, e=>{ S.err='No se pudo leer el equipo ('+e.code+').'; S.ready=true; render(); });
  db.collection('reservas').onSnapshot(snap=>{
    S.res=snap.docs.map(d=>({id:d.id,...d.data()}));
    if(S.me) render();
  }, e=>toast('No se pudieron cargar las reservas'));
}

function render(){
  const app=document.getElementById('app');
  const active=document.activeElement?.id;
  const keep={}; if(!S.clearForm) document.querySelectorAll('#app input[id],#app select[id]').forEach(el=>{ if(el.id!=='nr-date' && !el.id.startsWith('jm-') && el.id!=='nr-cat' && el.type!=='password') keep[el.id]=el.value });
  S.clearForm=false;
  if(!S.ready){ app.innerHTML=`<div class="wrap center"><div class="card"><img class="logo" alt="Happy Kids" src="${svgUrl(LOGO)}"><div class="stripe"></div><p>Conectando con la agenda…</p></div></div>`; return; }
  if(S.dbMissing){ app.innerHTML=`<div class="wrap center"><div class="card"><img class="logo" alt="Happy Kids" src="${svgUrl(LOGO)}"><div class="stripe"></div><h1>Agenda de reservas</h1><p>Esta vista no tiene acceso al almacén de reservas. Ábrela con una cuenta de Claude que tenga acceso a esta página.</p></div></div>`; return; }
  if(!S.staff || S.staff.length===0){ app.innerHTML=setupView(); bindSetup(); return; }
  if(!S.me){ app.innerHTML=loginView(); bindLogin(); return; }
  app.innerHTML=shell();
  bindShell();
  for(const [id,v] of Object.entries(keep)){ const el=document.getElementById(id); if(el && v!=='' ){ if(el.tagName==='SELECT'){ const o=[...el.options].find(o=>o.value===v); if(o && !o.disabled) el.value=v; } else el.value=v; } }
  if(S.view==='cal' && document.getElementById('nr-prev')) S._showPrev?.();
  document.querySelectorAll('#app select.in').forEach(enhanceSelect);
  if(active){const el=document.getElementById(active); if(el && el.tagName!=='BUTTON') el.focus();}
}

function bindSetup(){

function resByDate(){
  const m={};
  for(const r of S.res){ (m[r.fecha] ||= []).push(r) }
  return m;
}
function yearOptions(y){
  const now=new Date().getFullYear(), set=new Set();
  for(let k=now-2;k<=now+3;k++) set.add(k);

  return [...set].sort((a,b)=>a-b).map(k=>`<option value="${k}" ${k===y?'selected':''}>${k}</option>`).join('');
}

    const iso=pre+String(d).padStart(2,'0');
    let list=(by[iso]||[]).slice().sort((a,b)=>(a.hora||'').localeCompare(b.hora||''));
    const n=list.length;
    const hit=gf && list.some(r=>r.juego===gf);

    const chips=shown.map(r=>{const g=GBY[r.juego];return `<span class="ev" style="--c:${catColor(g)}">${ph(g,18,'ev-ph')}<span class="ev-t">${esc(g?.name||r.juego)}</span></span>`}).join('');

    cells+=`<button class="${cls}" data-date="${iso}" aria-label="${label}"><span class="num">${d}</span>${n&&!gf?`<span class="cnt">${n}</span>`:''}<span class="evs">${chips}${more}</span></button>`;
  }
  const tail=(7-(off+days)%7)%7; for(let i=0;i<tail;i++) cells+=`<span class="mday blank"></span>`;
  const nGame=gf?monthRes.filter(r=>r.juego===gf).length:0;

    <div class="yearhead">

  </div>${dayPanel(by)}</div>`;

function inCat(g,k){return k==='J'?g.primary==='J':g.tags.includes(k)}

  if(sel.closest('.dd')) return;
  const wrap=document.createElement('div'); wrap.className='dd'+(sel.id?' dd-'+sel.id:'');
  sel.parentNode.insertBefore(wrap,sel); wrap.appendChild(sel);
  sel.classList.add('dd-native'); sel.tabIndex=-1; sel.setAttribute('aria-hidden','true');
  const btn=document.createElement('button'); btn.type='button'; btn.className='dd-btn';
  btn.setAttribute('aria-haspopup','listbox'); btn.setAttribute('aria-expanded','false');
  const lbl=sel.getAttribute('aria-label')||sel.closest('label')?.firstChild?.textContent?.trim(); if(lbl) btn.setAttribute('aria-label',lbl);
  wrap.appendChild(btn);
  const paint=()=>{const o=sel.options[sel.selectedIndex]; const empty=!o||o.value==='';
    btn.innerHTML=`<span class="dd-val${empty?' ph-text':''}">${empty?esc(o?.textContent||'Elige…'):ddInner(o,true)}</span><span class="dd-chev">${CHEV}</span>`;
    btn.disabled=sel.disabled;};
  paint(); sel.addEventListener('change',paint);
  const open=()=>{
    closeAllDd(wrap); wrap.classList.add('open'); btn.setAttribute('aria-expanded','true');
    const list=document.createElement('div'); list.className='dd-list'; list.setAttribute('role','listbox');
    let h='';
    for(const node of sel.children){
      if(node.tagName==='OPTGROUP'){ h+=`<div class="dd-grp">${esc(node.label)}</div>`; for(const o of node.children) h+=optHtml(o); }
      else if(node.value!=='' ) h+=optHtml(node);
    }
    function optHtml(o){const on=o.value===sel.value;return `<button type="button" class="dd-opt" role="option" data-v="${esc(o.value)}" aria-selected="${on}" ${o.disabled?'aria-disabled="true"':''} tabindex="-1">${ddInner(o,false)}${on?'<span class="dd-check">✓</span>':''}</button>`}
    list.innerHTML=h||'<div class="dd-grp">Sin opciones</div>'; wrap.appendChild(list);
    const r=btn.getBoundingClientRect(); wrap.classList.toggle('up', innerHeight-r.bottom<280 && r.top>innerHeight-r.bottom);
    wrap.classList.remove('right'); const lr=list.getBoundingClientRect(); if(lr.right>innerWidth-8) wrap.classList.add('right');
    const opts=[...list.querySelectorAll('.dd-opt:not([aria-disabled])')];
    (list.querySelector('[aria-selected="true"]')||opts[0])?.focus({preventScroll:true});
    list.querySelector('[aria-selected="true"]')?.scrollIntoView({block:'nearest'});
    list.addEventListener('click',e=>{const b=e.target.closest('.dd-opt'); if(!b||b.getAttribute('aria-disabled')) return; choose(b.dataset.v)});
    list.addEventListener('keydown',e=>{const i=opts.indexOf(document.activeElement);
      if(e.key==='ArrowDown'){e.preventDefault();opts[Math.min(i+1,opts.length-1)]?.focus()}
      else if(e.key==='ArrowUp'){e.preventDefault();opts[Math.max(i-1,0)]?.focus()}
      else if(e.key==='Escape'||e.key==='Tab'){e.preventDefault();closeAllDd();btn.focus()}});
  };
  const choose=v=>{closeAllDd(); btn.focus(); if(sel.value!==v){ sel.value=v; sel.dispatchEvent(new Event('change',{bubbles:true})); }};
  btn.addEventListener('click',()=>wrap.classList.contains('open')?closeAllDd():open());
  btn.addEventListener('keydown',e=>{if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();open()}});
}
document.addEventListener('pointerdown',e=>{if(!e.target.closest('.dd')) closeAllDd()});

/* ---------- events ---------- */
function bindShell(){
  document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{S.view=b.dataset.view;S.confirmDel=null;render();window.scrollTo(0,0)});
  document.getElementById('logout').onclick=()=>{S.me=null;store('hk_user',null);render()};
  if(S.view==='cal') bindCal();
  if(S.view==='cat'){
    document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{S.catFilter=b.dataset.cat;render()});
    document.querySelectorAll('[data-see]').forEach(b=>b.onclick=()=>{const nx=S.res.filter(r=>r.juego===b.dataset.see && r.fecha>=isoDate(new Date())).map(r=>r.fecha).sort()[0]; if(nx){S.sel=nx;S.year=+nx.slice(0,4);S.month=+nx.slice(5,7)-1;}S.view='cal';render();window.scrollTo(0,0)});
  }
  if(S.view==='team') bindTeam();
}
function bindCal(){
  const shift=k=>{let m=S.month+k,y=S.year; if(m<0){m=11;y--} if(m>11){m=0;y++} S.month=m;S.year=y;render()};
  document.getElementById('prev').onclick=()=>shift(-1);
  document.getElementById('next').onclick=()=>shift(1);
  document.getElementById('todaybtn').onclick=()=>{const t=new Date();S.year=t.getFullYear();S.month=t.getMonth();S.sel=isoDate(t);render()};
  document.getElementById('jm-month').onchange=e=>{S.month=+e.target.value;render()};
  document.getElementById('jm-year').onchange=e=>{S.year=+e.target.value;render()};
  document.querySelectorAll('.mday[data-date]').forEach(b=>b.onclick=()=>{S.sel=b.dataset.date;S.confirmDel=null;render();
    if(window.innerWidth<=980) document.querySelector('.panel')?.scrollIntoView({behavior:'smooth',block:'start'})});
  document.getElementById('nr-date').onchange=e=>{ if(e.target.value){ S.sel=e.target.value; S.year=+S.sel.slice(0,4); S.month=+S.sel.slice(5,7)-1; render(); } };
  const gsel=document.getElementById('nr-game'), prev=document.getElementById('nr-prev');
  const showPrev=()=>{const g=GBY[gsel.value]; if(!g){prev.hidden=true;return} prev.hidden=false; prev.innerHTML=`${ph(g,72)}<div><div class="g">${esc(g.name)}</div>${g.age?`<div class="meta">${esc(g.age)}</div>`:''}${g.dims?`<div class="meta">${esc(g.dims)}</div>`:''}</div>`};
  gsel.addEventListener('change',showPrev); showPrev(); S._showPrev=showPrev;
  document.getElementById('nr-cat').onchange=e=>{S.nrCat=e.target.value;const gs=document.getElementById('nr-game');if(gs)gs.value='';render();document.querySelector('.dd-nr-game .dd-btn')?.focus()};
  document.querySelectorAll('[data-ask]').forEach(b=>b.onclick=()=>{S.confirmDel=b.dataset.ask;render()});
  document.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>{S.confirmDel=null;render()});
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
    try{ await S.db.collection('reservas').doc(b.dataset.del).delete(); S.confirmDel=null; toast('Reserva eliminada'); }
    catch(e){ toast('No se pudo eliminar ('+(e.code||'error')+')'); }
  });
  document.getElementById('newres').addEventListener('submit',async e=>{
    e.preventDefault();
    const fecha=val('nr-date'), juego=val('nr-game'), cliente=val('nr-client'), hora=val('nr-time'), nota=val('nr-note');
    const er=document.getElementById('nr-err');
    if(!fecha||!juego||!cliente){er.textContent='Completa fecha, juego y cliente.';return}
    const id=fecha+'_'+juego;
    const btn=e.submitter; if(btn) btn.disabled=true;
    try{
      const ref=S.db.collection('reservas').doc(id);
      const ex=await ref.get();
      if(ex.exists){ const o=ex.data(); er.textContent=`${GBY[juego].name} ya está reservado ese día para ${o.cliente}.`; if(btn) btn.disabled=false; return; }
      await ref.set({fecha,juego,cliente,hora,nota,creadoPor:S.me.id,creadoEn:new Date().toISOString()});
      S.sel=fecha; S.year=+fecha.slice(0,4); S.month=+fecha.slice(5,7)-1;
      toast(`${GBY[juego].name} reservado para ${cliente}`);
      S.clearForm=true; render();
    }catch(err){ er.textContent='No se pudo guardar ('+(err.code||err.message)+'). Inténtalo de nuevo.'; if(btn) btn.disabled=false; }
  });
}
function bindTeam(){
  const pf=document.getElementById('pwform');
  pf.addEventListener('submit',async e=>{
    e.preventDefault();
    const old=document.getElementById('pw-old').value, nw=document.getElementById('pw-new').value, er=document.getElementById('pw-err');
    if((await hash(old,S.me.salt))!==S.me.hash){er.textContent='La contraseña actual no coincide.';return}
    if(nw.length<6){er.textContent='La nueva contraseña necesita al menos 6 caracteres.';return}
    const salt=newSalt();
    try{ await S.db.collection('staff').doc(S.me.id).update({salt,hash:await hash(nw,salt)}); toast('Contraseña actualizada'); pf.reset(); }
    catch(err){ er.textContent='No se pudo guardar ('+(err.code||'error')+').' }
  });
  const af=document.getElementById('addstaff'); if(!af) return;
  af.addEventListener('submit',async e=>{
    e.preventDefault();
    const name=val('as-name'), user=slugUser(val('as-user')), pw=document.getElementById('as-pw').value, rol=val('as-rol'), er=document.getElementById('as-err');
    if(!user){er.textContent='El usuario solo puede tener letras, números, punto o guion.';return}
    if(S.staff.some(s=>s.id===user)){er.textContent='Ese usuario ya existe.';return}
    if(pw.length<6){er.textContent='La contraseña necesita al menos 6 caracteres.';return}
    const salt=newSalt();
    try{ await S.db.collection('staff').doc(user).set({nombre:name,rol,salt,hash:await hash(pw,salt),activo:true,creado:new Date().toISOString()});
      S.clearForm=true; toast(`${name} ya puede entrar como «${user}»`); }
    catch(err){ er.textContent='No se pudo crear ('+(err.code||'error')+').' }
  });
  document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=async()=>{
    const u=S.staff.find(s=>s.id===b.dataset.toggle);
    try{ await S.db.collection('staff').doc(u.id).update({activo:u.activo===false}); }catch(e){toast('No se pudo actualizar')}
  });
  document.querySelectorAll('[data-reset]').forEach(b=>b.onclick=()=>{
    const u=S.staff.find(s=>s.id===b.dataset.reset);
    document.getElementById('resetbox').innerHTML=`<form class="card" id="resetform" style="max-width:none"><h3 style="font-size:20px">Nueva contraseña para ${esc(u.nombre)}</h3>
      <label class="f">Contraseña<input class="in" id="rs-pw" type="text" minlength="6" required autocomplete="off"></label><div class="err" id="rs-err"></div>
      <div style="display:flex;gap:8px"><button class="btn" type="submit">Guardar</button><button class="btn ghost" type="button" id="rs-cancel">Cancelar</button></div></form>`;
    document.getElementById('rs-pw').focus();
    document.getElementById('rs-cancel').onclick=()=>document.getElementById('resetbox').innerHTML='';
    document.getElementById('resetform').addEventListener('submit',async e=>{
      e.preventDefault(); const pw=document.getElementById('rs-pw').value;
      if(pw.length<6){document.getElementById('rs-err').textContent='Mínimo 6 caracteres.';return}
      const salt=newSalt();
      try{ await S.db.collection('staff').doc(u.id).update({salt,hash:await hash(pw,salt)}); toast('Contraseña restablecida'); document.getElementById('resetbox').innerHTML=''; }
      catch(err){ document.getElementById('rs-err').textContent='No se pudo guardar.' }
    });
  });
}

boot();
</script>
